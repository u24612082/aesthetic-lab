name: AestheticBridge
options:
  bundleIdPrefix: local.aestheticlab
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  AestheticBridge:
    type: application
    platform: iOS
    sources: [AestheticBridge]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.aestheticlab.bridge
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: AestheticBridge/AestheticBridge.entitlements
        INFOPLIST_KEY_NSHealthShareUsageDescription: Read your selected Liftoff workout summaries for your private local dashboard.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Aesthetic Bridge does not write health data.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Aesthetic Bridge
    entitlements:
      path: AestheticBridge/AestheticBridge.entitlements
      properties:
        com.apple.developer.healthkit: true
